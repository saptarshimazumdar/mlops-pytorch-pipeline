apiVersion: batch/v1
kind: Job
metadata:
  name: ml-training-job
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: ml-training-job
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "src/train.py"]
          env:
            - name: TRAINING_CONFIG_PATH
              value: /app/configs/training_config.yaml
            - name: DATA_DIR
              value: /app/data
            - name: OUTPUT_DIR
              value: /app/checkpoints
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: training-data
              mountPath: /app/data
            - name: checkpoint-output
              mountPath: /app/checkpoints
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: training-data
          persistentVolumeClaim:
            claimName: ml-training-data-pvc
        - name: checkpoint-output
          persistentVolumeClaim:
            claimName: ml-training-checkpoints-pvc
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
